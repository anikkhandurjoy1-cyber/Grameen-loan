<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গ্রামীন আশার আলো কৃষি সমবায় সমিতি লিঃ</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2.0.0">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loader">
  <div style="text-align:center">
    <div style="position:relative;width:100px;height:100px;margin:0 auto 20px;">
      <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#e74c3c,#e67e22,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c);animation:spin 1.5s linear infinite;"></div>
      <div style="position:absolute;inset:4px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <img src="logo.png" style="width:92px;height:92px;object-fit:cover;border-radius:50%;" alt="">
      </div>
    </div>
    <h2 style="color:#fff;font-size:18px;margin-bottom:4px;">গ্রামীন আশার আলো</h2>
    <p style="color:rgba(255,255,255,.7);font-size:12px;">কৃষি সমবায় সমিতি লিঃ</p>
  </div>
</div>

<div id="loginScreen" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1a5276 0%,#148f77 100%);align-items:center;justify-content:center;z-index:1000;">
  <div class="login-box">
    <div class="logo">
      <img src="logo.png" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px;" alt="">
      <h2>গ্রামীন আশার আলো<br>কৃষি সমবায় সমিতি লিঃ</h2>
      <p>নিবন্ধন নংঃ- ২০২৫.১.০১.৭২৪০.০২১৩</p>
    </div>
    <div class="field"><label>ইউজার আইডি</label><input type="text" id="loginUser" placeholder="User ID" autocomplete="username"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="loginPass" placeholder="Password" autocomplete="current-password"></div>
    <button class="btn-login" onclick="doLogin()">লগইন করুন →</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <button class="menu-btn" onclick="toggleSidebar()" title="মেনু">☰</button>
    <button class="menu-btn" onclick="history.back()" title="পূর্বের পেজ" style="padding:4px 6px;">←</button>
    <div class="logo-area" onclick="App.go('dashboard')" style="cursor:pointer">
      <img src="logo.png" alt="">
      <div><div class="org-name">গ্রামীন আশার আলো</div><div class="org-sub">কৃষি সমবায় সমিতি লিঃ</div></div>
    </div>
    <div class="hdr-info"><b id="hdrBranch"></b><span id="hdrDate"></span><span id="hdrUser"></span></div>
    <button class="user-btn" onclick="showBranchModal()" title="Change Branch">🏢</button>
    <button class="user-btn" onclick="App.go('profile')" title="প্রোফাইল">👤</button>
    <button class="user-btn" onclick="doLogout()" title="লগআউট">⏻</button>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar closed" id="sidebar">
    <div class="menu-search"><input id="menuSearch" placeholder="🔍 মেনু খুঁজুন..." oninput="filterMenu(this.value)"></div>
    <div id="sidebarNav"></div>
  </div>
  <div id="noticeBar"></div>
  <div class="main" id="mainContent"></div>
</div>

<script src="js/ref-data.js?v=2.0.0"></script>
<script src="js/core.js?v=2.0.0"></script>
<script src="js/engine.js?v=2.0.0"></script>
<script src="js/txn.js?v=2.0.0"></script>
<script src="js/menu.js?v=2.0.0"></script>
<script src="js/pages/settings.js?v=2.0.0"></script>
<script src="js/pages/users.js?v=2.0.0"></script>
<script src="js/pages/members.js?v=2.0.0"></script>
<script src="js/pages/accounts.js?v=2.0.0"></script>
<script src="js/pages/loan.js?v=2.0.0"></script>
<script src="js/pages/deposit.js?v=2.0.0"></script>
<script src="js/pages/collection.js?v=2.0.0"></script>
<script src="js/pages/ais.js?v=2.0.0"></script>
<script src="js/pages/interbranch.js?v=2.0.0"></script>
<script src="js/pages/salary.js?v=2.0.0"></script>
<script src="js/pages/reports-ais.js?v=2.0.0"></script>
<script src="js/pages/reports-inst.js?v=2.0.0"></script>
<script src="js/pages/reports-balance.js?v=2.0.0"></script>
<script src="js/pages/reports-register.js?v=2.0.0"></script>
<script src="js/pages/dashboard.js?v=2.0.0"></script>
<script src="js/pages/import.js?v=2.0.0"></script>
</body>
</html>
